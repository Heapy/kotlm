name: "Build"

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: liberica
          java-version: "25"
      - name: "Build and test"
        run: ./kotlin test

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: "Set lowercase image name"
        run: |
          repository="${{ github.repository }}"
          printf 'IMAGE_NAME=%s\n' "${repository,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: "Log in to GHCR"
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: "Docker meta"
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha
      - name: "Build and push"
        uses: docker/build-push-action@v7
        with:
          context: .
          # A manifest list cannot be loaded into the local daemon, so pull requests
          # build only the architecture used by the smoke test.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "Smoke test"
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"

          # The proxy must refuse to start without project keys.
          if out=$(docker run --rm "$image" 2>&1); then
            echo "$out"
            echo "expected a non-zero exit without client keys" && exit 1
          fi
          echo "$out" | grep -q "No client keys configured"

          # With keys configured, the proxy starts and responds to its liveness probe.
          docker run -d --name kotlm-smoke -p 18080:8080 \
            -e KOTLM_CLIENTS='{"clients":[{"name":"smoke","key":"smoke-key-0123456789"}]}' \
            -e KOTLM_STATE_DIR=/tmp/kotlm "$image"
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18080/live > /dev/null; then ready=1; break; fi
            sleep 1
          done
          docker logs kotlm-smoke
          docker rm -f kotlm-smoke
          test "${ready:-0}" = "1"

          # Compose must bootstrap without an auth file so device login remains usable.
          mkdir -p secrets
          printf '%s\n' '{"clients":[{"name":"compose-smoke","key":"compose-smoke-key-0123456789"}]}' > secrets/clients.json
          KOTLM_IMAGE="$image" KOTLM_ADMIN_KEY=compose-admin-key-0123456789 docker compose up -d --no-build
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/live > /dev/null; then compose_ready=1; break; fi
            sleep 1
          done
          KOTLM_IMAGE="$image" KOTLM_ADMIN_KEY=compose-admin-key-0123456789 docker compose logs kotlm
          KOTLM_IMAGE="$image" KOTLM_ADMIN_KEY=compose-admin-key-0123456789 docker compose down -v
          test "${compose_ready:-0}" = "1"
